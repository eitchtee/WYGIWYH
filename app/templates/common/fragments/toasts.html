{% load i18n %}
{% load toast_bg %}
{% if messages %}
  {% for message in messages %}
      <div class="toasty alert alert-{{ message.tags | toast_bg }} grid-cols-[auto_1fr_auto] items-start gap-3 pe-2"
           role="alert"
           aria-live="assertive"
           aria-atomic="true">
          <i class="{{ message.tags | toast_icon }} fa-fw mt-1"></i>
          <div class="min-w-0 break-words">
              <strong>{{ message.tags | toast_title }}</strong>
              <div>{{ message }}</div>
          </div>
          {# -mt-1 centers the 2rem button on the 1.5rem title line #}
          <button type="button"
                  class="btn btn-ghost btn-sm btn-square -mt-1"
                  _="on click remove closest .toasty"
                  aria-label="{% translate 'Close' %}">
              <i class="fa-solid fa-xmark"></i>
          </button>
      </div>
  {% endfor %}
{% endif %}
